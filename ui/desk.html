<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Aura desktop</title>
  <style>
    /* Sits on top of the song wallpaper. Positions match the wallpaper image: cover centred at
       42% height, 40% tall; title and artist under it; lyrics and controls below those. */
    :root { --accent: #fe9090; }
    * { box-sizing: border-box; margin: 0; }
    html, body { background: transparent; width: 100vw; height: 100vh; overflow: hidden; user-select: none; }
    body { font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; color: #fff; }
    .lyrics {
      position: absolute; left: 50%; top: 77.5vh; transform: translateX(-50%); width: 70vw; text-align: center;
      text-shadow: 0 2px 14px rgba(0,0,0,.6);
    }
    .line { font-size: 3.3vh; font-weight: 800; line-height: 1.25; transition: opacity .35s; }
    .next { font-size: 2.1vh; font-weight: 600; color: rgba(255,255,255,.5); margin-top: .8vh; transition: opacity .35s; }
    .fade { opacity: 0; }
    .controls {
      position: absolute; left: 50%; top: 88vh; transform: translateX(-50%);
      display: flex; gap: 1.6vh; align-items: center; padding: .9vh 1.4vh; border-radius: 99px;
      background: rgba(10, 12, 18, .35); border: 1px solid rgba(255,255,255,.12); backdrop-filter: blur(16px);
      opacity: .55; transition: opacity .2s;
    }
    .controls:hover { opacity: 1; }
    button {
      width: 5vh; height: 5vh; border: 0; border-radius: 50%; background: transparent; color: #fff; cursor: pointer;
      display: grid; place-items: center; transition: background .15s, transform .1s;
    }
    button:hover { background: rgba(255,255,255,.14); }
    button:active { transform: scale(.92); }
    button.play { width: 6.2vh; height: 6.2vh; background: var(--accent); color: #111; }
    svg { width: 45%; height: 45%; fill: currentColor; }
  </style>
</head>
<body>
  <div class="lyrics">
    <div class="line" id="line"></div>
    <div class="next" id="next"></div>
  </div>
  <div class="controls" id="controls">
    <button data-a="prev" title="Previous"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM19 5L9 12l10 7z"/></svg></button>
    <button data-a="toggle" class="play" id="pp" title="Play/pause"><svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg></button>
    <button data-a="next" title="Next"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM5 5l10 7-10 7z"/></svg></button>
  </div>
  <script>
    const { emit, listen } = window.__TAURI__.event;
    const { invoke } = window.__TAURI__.core;
    const $ = (id) => document.getElementById(id);
    const PLAY = '<svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg>';
    const PAUSE = '<svg viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>';

    function setText(el, text) {
      if (el.textContent === text) return;
      el.classList.add("fade");
      setTimeout(() => { el.textContent = text; el.classList.remove("fade"); }, 250);
    }

    listen("aura-np", ({ payload: p }) => {
      setText($("line"), p.line && p.line !== "♪" ? p.line : "");
      setText($("next"), p.next || "");
      $("pp").innerHTML = p.playing ? PAUSE : PLAY;
      if (p.accent) document.documentElement.style.setProperty("--accent", p.accent);
    });
    document.querySelectorAll("[data-a]").forEach((b) => (b.onclick = () => emit("aura-widget-action", b.dataset.a)));

    // Tell Aura where the controls are, so clicks there are caught and everything else
    // passes through to the desktop.
    function reportHotArea() {
      const r = $("controls").getBoundingClientRect(), s = window.devicePixelRatio || 1;
      invoke("desk_hot", {
        x: Math.round((window.screenX + r.left) * s), y: Math.round((window.screenY + r.top) * s),
        w: Math.round(r.width * s), h: Math.round(r.height * s),
      }).catch(() => {});
    }
    addEventListener("resize", reportHotArea);
    setTimeout(reportHotArea, 300);
    emit("aura-widget-ready");
  </script>
</body>
</html>
