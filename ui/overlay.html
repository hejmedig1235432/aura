<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Aura overlay</title>
  <style>
    :root { --accent: #fe9090; }
    * { box-sizing: border-box; margin: 0; }
    html, body { background: transparent; height: 100%; overflow: hidden; pointer-events: none; }
    body { font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: #fff; padding: 8px; }
    .card {
      position: relative; height: 100%; display: flex; gap: 14px; align-items: center; padding: 10px 16px 10px 10px; overflow: hidden;
      border-radius: 18px; background: rgba(14, 16, 24, .82); border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 12px 34px rgba(0,0,0,.45);
      opacity: 0; transform: translateY(-14px) scale(.98); transition: opacity .22s ease, transform .22s ease;
    }
    .card.show { opacity: 1; transform: none; }
    .bg { position: absolute; inset: -40px; background-size: cover; background-position: center; filter: blur(36px) brightness(.45) saturate(1.5); z-index: -1; }
    img { width: 76px; height: 76px; border-radius: 10px; object-fit: cover; flex: none; background: rgba(255,255,255,.08); }
    .meta { flex: 1; min-width: 0; }
    .label { font-size: 11px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; color: var(--accent); margin-bottom: 3px; }
    .title { font-size: 16px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .artist { font-size: 13px; color: rgba(255,255,255,.65); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .vol { height: 4px; border-radius: 4px; background: rgba(255,255,255,.18); margin-top: 8px; overflow: hidden; display: none; }
    .vol div { height: 100%; background: var(--accent); transition: width .2s; }
    .card.volume .vol { display: block; }
    .icon { font-size: 22px; flex: none; width: 30px; text-align: center; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="bg" id="bg"></div>
    <img id="cover" alt="" />
    <div class="meta">
      <div class="label" id="label"></div>
      <div class="title" id="title"></div>
      <div class="artist" id="artist"></div>
      <div class="vol"><div id="vol"></div></div>
    </div>
    <div class="icon" id="icon"></div>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    const ICON = { toggle: (p) => (p.playing ? "▶" : "⏸"), next: () => "⏭", prev: () => "⏮", like: (p) => (p.liked ? "♥" : "♡"), volup: () => "🔊", voldown: () => "🔉" };
    let hideTimer;
    window.__TAURI__.event.listen("aura-overlay", ({ payload: p }) => {
      if (p.accent) document.documentElement.style.setProperty("--accent", p.accent);
      $("title").textContent = p.title || "Nothing playing";
      $("artist").textContent = p.artist || "";
      $("label").textContent = p.label || "Now playing";
      if (p.cover) { $("cover").src = p.cover; $("bg").style.backgroundImage = `url("${p.cover}")`; }
      $("icon").textContent = (ICON[p.action] || (() => ""))(p);
      const isVol = p.action === "volup" || p.action === "voldown";
      $("card").classList.toggle("volume", isVol);
      if (isVol) { $("vol").style.width = `${p.volume}%`; $("label").textContent = `Volume ${p.volume}%`; }
      $("card").classList.add("show");
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => $("card").classList.remove("show"), 2600);
    });
  </script>
</body>
</html>
